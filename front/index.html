<!DOCTYPE html>
<html lang="pt-BR">
  <!-- Aplica o tema salvo antes do React montar (evita “flash”) -->
<script>
  (function () {
    var theme = localStorage.getItem('theme') || 'theme-emerald';
    document.documentElement.classList.add(theme);
  })();
</script>
